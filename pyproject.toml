
[project]
name = "cerebellum"
version = "0.1.2"
description = "Cognitive architecture for AI agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "axonium>=0.6.0",
    # pydantic is available through axonium's transitive dependencies
    "qdrant-client>=1.17.0",
    "sentence-transformers>=5.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "flake8>=7.0.0",
  "mypy",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
axonium = { git = "https://github.com/Root1V/axonium-sdk.git", rev = "main" }

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
