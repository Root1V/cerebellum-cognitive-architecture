name: semantic-version

on:
  push:
    branches:
      - main

# Permisos declarados por job, no globalmente,
# para aplicar el principio de mínimo privilegio.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: python
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  gen-release-notes:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest

    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print release info
        run: |
          echo "Tag: ${{ needs.release-please.outputs.tag_name }}"
          echo "Version: ${{ needs.release-please.outputs.version }}"

      - name: Get commits since last release
        id: commits
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"- %s" -n 50)
          fi
          echo "$COMMITS" > commits.txt

      - name: Generate release notes with OpenAI LLM
        id: gen-ai-notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          echo "Generando notas de release con OpenAI..."
          COMMITS_JSON=$(jq -Rs . < commits.txt)

          PAYLOAD=$(jq -n \
            --arg tag "$TAG" \
            --argjson commits "$COMMITS_JSON" \
            '{
              model: "gpt-4o-mini",
              messages: [
                {
                  role: "system",
                  content: "Eres un redactor técnico experto. A partir de la lista de cambios que te proporciono, genera notas de release en castellano, bien estructuradas y profesionales. Incluye: un resumen breve de 1-2 líneas al inicio, y secciones para Nuevas funcionalidades, Correcciones de bugs, y otros cambios. Usa un tono cercano pero profesional."
                },
                {
                  role: "user",
                  content: ("Genera las notas de release para la versión " + $tag + " basándote en los siguientes commits:\n\n" + $commits)
                }
              ],
              temperature: 0.7,
              max_tokens: 512
            }')

          # Quitamos -f para poder ver el error real de la API en el log si falla
          RESPONSE=$(curl -s \
            https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD")

          # Validar si hubo error en la respuesta de OpenAI
          ERROR_MSG=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR_MSG" ]; then
            echo "Error de la API de OpenAI: $ERROR_MSG"
            exit 1
          fi

          SUMMARY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$SUMMARY" ] || [ "$SUMMARY" == "null" ]; then
            echo "Error: No se pudo generar el resumen. Respuesta completa:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Notas de release generadas por LLM:"
          echo "$SUMMARY"

          # Persistir las notas en el release de GitHub
          gh release edit "$TAG" --notes "$SUMMARY"
