name: PR-Validation
run-name: "PR #${{ github.event.pull_request.number }} Validation - ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:

  lint-and-test:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"
          enable-caching: true

      - name: Instalar axonium desde repo público
        run: |
          uv pip install --system git+https://github.com/Root1V/axonium-sdk.git@main

      - name: Install dependencies with uv
        run: |
          uv pip install --system -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Run unit tests
        run: pytest tests/unit
